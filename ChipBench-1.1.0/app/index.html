<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChipBench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231e293b'/%3E%3Cpath d='M32 12l20 20-20 20-20-20z' fill='%2360a5fa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/chipbench.css">
</head>
<body>
<div class="splash" id="splash"><div class="lg"><i></i></div><b>ChipBench</b><small>芯片 AE 的工作台</small></div>
<div id="app">
  <nav id="rail"><div class="logo" title="ChipBench"><i></i></div><div class="gap"></div></nav>
  <aside id="side">
    <div class="side-h"><span class="t" id="side-title"></span><span id="side-actions" class="row"></span></div>
    <div class="pane" id="pane-outline"><div class="side-b"><div class="empty">打开文档后显示大纲</div></div></div>
  </aside>
  <div id="resizer"></div>
  <main id="main">
    <div id="tabs"></div>
    <div id="crumbs"></div>
    <div id="stage">
      <div id="ed-pane" class="stage-pane hide"><div id="ed-host" style="height:100%"></div>
        <div id="find"><div class="r"><input class="input" id="find-q" placeholder="查找" style="flex:1"><span class="cnt" id="find-cnt"></span><button class="btn icon sm" id="find-prev" title="上一个">↑</button><button class="btn icon sm" id="find-next" title="下一个">↓</button><button class="btn icon sm" id="find-close">✕</button></div>
          <div class="r" id="find-rep-row"><input class="input" id="find-r" placeholder="替换为" style="flex:1"><button class="btn sm" id="find-rep">替换</button><button class="btn sm" id="find-repall">全部</button></div>
          <div class="r"><label><input type="checkbox" id="find-case">区分大小写</label><label><input type="checkbox" id="find-re">正则</label></div></div>
      </div>
      <div id="pv-pane" class="stage-pane pv hide"></div>
      <div id="view-pane" class="stage-pane hide"></div>
      <div id="welcome-pane" class="stage-pane" style="overflow:auto"></div>
    </div>
  </main>
  <aside id="right"></aside>
  <div id="status"><span id="st-mode" class="clk" title="切换模式 (Ctrl+/)"></span><span id="st-pos"></span><span id="st-ws" class="clk" title="工作区"></span><span class="sp"></span><span id="st-goal" style="display:none"></span><span id="st-idx" title="索引状态"></span><span id="st-enc" class="clk" title="文件编码"></span><span id="st-words"></span><span id="st-chars"></span><span id="st-lines"></span><span id="st-read"></span></div>
</div>
<div id="drop-mask">松开以打开文件 / 文件夹 / 插入图片</div>
<div id="lightbox"><div class="lb-stage"></div><div class="lb-tip">滚轮缩放 · 拖动平移 · 双击复位 · Esc 关闭</div></div>
<script>window.ChipBench = window.ChipBench || {};</script>
<script src="js/logic.js"></script>
<script src="js/net-logic.js"></script>
<script src="js/model.js"></script>
<script src="js/md.js"></script>
<script src="js/core.js"></script>
<script src="js/editor.js"></script>
<script src="js/edit-tools.js"></script>
<script src="js/app.js"></script>
<script src="js/index.js"></script>
<script src="js/workspace.js"></script>
<script src="js/widgets.js"></script>
<script src="js/viewers.js"></script>
<script src="js/plan.js"></script>
<script src="js/learn.js"></script>
<script src="js/panels.js"></script>
<script src="js/tools.js"></script>
<script src="js/extras.js"></script>
<script src="js/net.js"></script>
<script src="js/skills.js"></script>
<script src="js/boot.js"></script>
  <script src="js/docs-data.js"></script>
  <script src="js/integration.js"></script>
  <script src="js/viewer-pptx.js"></script>
  <script src="js/viewer-html.js"></script>
  <script src="js/format-toolbar.js"></script>
  <script src="js/panels-pro.js"></script>
  <script src="js/help.js"></script>
  <script src="js/workbench.js"></script>
</body>
</html>
