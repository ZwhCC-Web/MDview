name: Build ChipBench Desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node tests/logic.test.js && node tests/md.test.js && node tests/net.test.js && node tests/rt.test.js && node tests/model.test.js && node tests/atlas-model.test.js
      - run: python mcp/test_mcp.py && python mcp/test_mcp17.py && python mcp/test_aenet.py && python mcp/test_atlas_parity.py && python tools/sync-skills.py --check
      - run: python tools/check-modules.py && python tools/check-css.py && python tools/check-rust.py
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: End-to-end tests (mock desktop)
        run: |
          for t in t_boot t_editor t_features t_tools t_viewers t_ws t_misc t_modules t_net t_v11 t_v12 t_v13 t_v14 t_v141 t_v15 t_v16 t_v162 t_pdfnav t_filesafe t_ws17 t_readfill t_treecolor t_mcp17 t_atlas17 t_states17 t_diag17; do python tests/$t.py || exit 1; done
      - name: Performance budget
        run: python tests/t_perf.py && python scripts/check_perf.py && python tests/t_perf17.py && python scripts/check_perf.py 17
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: python tools/make-installer.py --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build
      - run: python tools/make-installer.py --collect
      - uses: actions/upload-artifact@v4
        with:
          name: ChipBench-Windows
          path: dist/ChipBench-*/
